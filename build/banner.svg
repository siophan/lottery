<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 302">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9e0d15"/>
      <stop offset="0.55" stop-color="#c8161e"/>
      <stop offset="1" stop-color="#e2361f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="52%" r="45%">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c1"/>
      <stop offset="0.5" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#e9a227"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd36a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#ffd36a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.6" stop-color="#f6c24a"/>
      <stop offset="1" stop-color="#c98a14"/>
    </radialGradient>
    <radialGradient id="pearl" cx="36%" cy="32%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f6f1ea"/>
      <stop offset="1" stop-color="#d9cfc2"/>
    </radialGradient>
    <radialGradient id="catBall" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="0.55" stop-color="#f0301e"/>
      <stop offset="1" stop-color="#b8140c"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb13b"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <!-- auspicious-cloud motif -->
    <g id="cloud" fill="none" stroke="#ffd36a" stroke-width="2" stroke-linecap="round">
      <path d="M0 20 a14 14 0 0 1 14 -14 a12 12 0 0 1 22 2 a12 12 0 0 1 20 10 h-18 a6 6 0 0 0 -6 -6 a8 8 0 0 0 -8 8 z"/>
      <path d="M4 26 h60"/>
    </g>
    <g id="lucky">
      <circle r="24" fill="url(#pearl)"/>
      <circle r="24" fill="none" stroke="#ffd36a" stroke-width="1.5" opacity=".8"/>
      <ellipse cx="-8" cy="-10" rx="8" ry="5" fill="#fff" opacity=".9"/>
    </g>
    <g id="money">
      <circle r="17" fill="url(#coin)"/>
      <circle r="12.5" fill="none" stroke="#b97a0e" stroke-width="1.6" opacity=".7"/>
      <rect x="-4.5" y="-4.5" width="9" height="9" fill="#b97a0e" opacity=".75"/>
    </g>
  </defs>

  <rect width="660" height="302" fill="url(#bg)"/>
  <rect width="660" height="302" fill="url(#glow)"/>

  <!-- faint pattern -->
  <g opacity=".14">
    <use xlink:href="#cloud" transform="translate(20 230) scale(1.4)"/>
    <use xlink:href="#cloud" transform="translate(300 24) scale(1.1)"/>
    <use xlink:href="#cloud" transform="translate(560 248) scale(1.3)"/>
    <use xlink:href="#cloud" transform="translate(250 250) scale(.9)"/>
  </g>
  <g fill="none" stroke="#ffd36a" opacity=".22">
    <circle cx="512" cy="156" r="128" stroke-width="1.2"/>
    <circle cx="512" cy="156" r="112" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- copy -->
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="44" y="74" font-size="15" font-weight="600" letter-spacing="5" fill="#ffd36a">LOTTERY MAO</text>
    <rect x="44" y="86" width="150" height="2" fill="url(#goldH)"/>
    <text x="42" y="146" font-size="46" font-weight="800" letter-spacing="3" fill="url(#gold)"
          stroke="#7a0a10" stroke-width="1" paint-order="stroke">招财选号</text>
    <text x="44" y="190" font-size="20" font-weight="500" letter-spacing="2" fill="#fff4dc">数据驱动决策 · 好运一路相随</text>
    <g transform="translate(44 214)">
      <rect width="92" height="28" rx="14" fill="none" stroke="#ffd36a" stroke-width="1.4"/>
      <text x="46" y="19" font-size="13" text-anchor="middle" fill="#ffd36a" letter-spacing="1">智能算号</text>
      <rect x="104" width="92" height="28" rx="14" fill="none" stroke="#ffd36a" stroke-width="1.4"/>
      <text x="150" y="19" font-size="13" text-anchor="middle" fill="#ffd36a" letter-spacing="1">走势分析</text>
    </g>
  </g>

  <!-- gold disc behind the cat -->
  <circle cx="512" cy="160" r="92" fill="url(#coin)" opacity=".95"/>
  <circle cx="512" cy="160" r="82" fill="none" stroke="#fff3c4" stroke-width="2" opacity=".8"/>

  <!-- cat (logo artwork, 512 box scaled to ~150px) -->
  <g transform="translate(436 86) scale(.3)">
    <path fill="#fff6e0" stroke="#fff6e0" stroke-width="22" stroke-linejoin="round" d="M96 196 L84 74 Q82 46 108 56 L214 112 Q256 102 298 112 L404 56 Q430 46 428 74 L416 196 Q448 248 448 300 A192 192 0 0 1 64 300 Q64 248 96 196 Z"/>
    <path fill="url(#catBall)" d="M96 196 L84 74 Q82 46 108 56 L214 112 Q256 102 298 112 L404 56 Q430 46 428 74 L416 196 Q448 248 448 300 A192 192 0 0 1 64 300 Q64 248 96 196 Z"/>
    <path fill="url(#ear)" d="M118 172 L112 96 L184 132 Z"/>
    <path fill="url(#ear)" d="M394 172 L400 96 L328 132 Z"/>
    <path fill="#fff" opacity=".22" d="M120 250 Q150 160 250 150 Q180 180 150 270 Z"/>
    <g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round">
      <path d="M150 292 Q182 252 214 292"/>
      <path d="M298 292 Q330 252 362 292"/>
    </g>
    <path fill="#ffd23f" d="M240 318 h32 l-16 18 z"/>
    <path fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" d="M256 336 v8 q-12 18 -28 6 M256 344 q12 18 28 6"/>
    <g stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".9">
      <path d="M136 334 L90 326"/><path d="M138 358 L94 366"/>
      <path d="M376 334 L422 326"/><path d="M374 358 L418 366"/>
    </g>
  </g>

  <!-- lottery balls -->
  <g font-family="Arial Black, Helvetica, sans-serif" font-weight="900" text-anchor="middle" fill="#c8161e">
    <g transform="translate(400 238)"><use xlink:href="#lucky"/><text y="9" font-size="24">8</text></g>
    <g transform="translate(620 92) scale(.82)"><use xlink:href="#lucky"/><text y="9" font-size="24">6</text></g>
    <g transform="translate(612 238) scale(.92)"><use xlink:href="#lucky"/><text y="9" font-size="24">9</text></g>
  </g>
  <!-- coins + sparkles -->
  <use xlink:href="#money" transform="translate(410 84) scale(.9)"/>
  <use xlink:href="#money" transform="translate(560 272) scale(.75)"/>
  <g fill="#fff3c4">
    <path d="M448 50 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M596 160 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M360 120 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".8"/>
  </g>
</svg>
