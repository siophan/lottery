name: Build clients

# Builds both installers on GitHub runners: the Windows (.exe) NSIS installer on
# windows-latest (electron-builder cannot produce NSIS on macOS without Wine) and
# the macOS arm64 .dmg on macos-latest (Apple silicon).
#
# Triggers:
#   - Manual run (Actions tab -> "Build clients" -> Run workflow): artifacts only
#   - Pushing a tag like v1.0.0 -> also publishes ys-mac.dmg / ys-win.exe to a
#     GitHub Release, which the production server downloads from
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS, ia32)
        run: npm run dist:win
        env:
          # The project is unsigned (self-distributed). Skip any auto-publish.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ys-win
          path: dist/ys-win.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installer (dmg, arm64)
        run: |
          npm run dist:mac
          cp dist/*-arm64.dmg dist/ys-mac.dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ys-mac
          path: dist/ys-mac.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum ys-mac.dmg ys-win.exe > SHA256SUMS && cat SHA256SUMS

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/ys-mac.dmg
            out/ys-win.exe
            out/SHA256SUMS
          fail_on_unmatched_files: true
