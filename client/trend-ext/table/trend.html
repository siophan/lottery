	<body>
		<script>
			//从url截取获得的所有信息存入缓存
			var url = window.location.href.substr(0).split("?")[1];
			var type = url.split("&");
			var obj = {};
			for (var i = 0; i < type.length; i++) {
				var key = type[i].split("=")[0];
				var val = type[i].split("=")[1];
				if (key == "language") {
					obj.language = val;
				} else if (key == "token") {
					obj.token = val;
				} else if (key == "code") {
					obj.code = val;
				} else if (key == "play_id") {
					obj.play_id = val;
				} else if (key == "chart_id") {
					obj.chart_id = val;
				} else if (key == "from_Id") {
					obj.from_Id = val;
				} else if (key == "back") {
					obj.back = val;
				} else if (key == "from_type") {
					obj.from_type = val;
				} else if (key == "api" || key == "ds") {
					// 走势窗口带来的 apiURL 与工作台所选数据源 requestUrl（见 js/common.js request）
					try { obj[key] = decodeURIComponent(val || ""); } catch (e) { obj[key] = ""; }
				}
			}
			common.cookieSet("trendid", obj.chart_id);
			common.cookieSet("language", obj.language);
			common.cookieSet("obj", JSON.stringify(obj));
			$(document).ready(function() {
				common.receive(JSON.parse(common.cookieGet("obj")));
				window.setInterval(getData, 5000);
			});
		</script>
