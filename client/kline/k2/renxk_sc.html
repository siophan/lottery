	function pushdArray(arr, index, value, value2) { //arr 被插二维数组 index二维数组索引 value插入值
		arr[index] = new Array();
		arr[index][0] = index + 1;
		arr[index][1] = value;
		arr[index][2] = value2;
		arr[index][3] = value;
		arr[index][4] = value2;
		arr[index][5] = value;
		arr[index][6] = value2;
		arr[index][7] = value;
		arr[index][8] = value2;
		arr[index][9] = value;
		arr[index][10] = value2;

		return arr;
	}

	function addMainData(data23) {
		myChart.clear();
		//1105r5任五  1105a3前三组  1105a2前二组   1105a3z前三直  1105a2z前二直
		var datar5 = new Array();
		var datar51 = new Array();
		//ma标准
		var ma1 = 0;
		var bc = jsbcr5();
		var pjyl = "";
		//				console.log("理论遗漏："+bc)
		var yl1 = 0;
		for (var i = 0; i < data23.length; i++) { //计算k线
			//K线
			var one = i + 1;
			var yn = data23[i].result; //y红  n绿
			if (yn.toString() == "y") { //红
				datar5 = pushdArray(datar5, i, hm1, (hm1 + bc));
				hm1 = hm1 + bc; //红线计算上端坐标
				//ksc ++;
				yl1 = 0;
			} else { //绿
				datar5 = pushdArray(datar5, i, hm1, (hm1 - 1));
				hm1 = hm1 - 1; //绿线计算下端坐标   固定值为-1
				yl1++;
			}

			//收盘价c
			var spjC = hm1;
			//					console.log(i+"收盘价："+spjC)
			//当前是否超出不长
			var js1 = i - (bcfw - 1);
			if (js1 > 0) { //当等于步长时，去掉
				if (yn.toString() == "y") {
					if (zqValue[0] == "y") {

					} else {
						zqNum++;
						cwNum--;
					}
				} else {
					if (zqValue[0] == "n") {

					} else {
						zqNum--;
						cwNum++;
					}
				}
				hlxzh = hlxzh - datar5[js1 - 1][1] + hm1;
				zqValue.splice(0, 1);
				zqValue.push(yn);
				bcnCnum.splice(0, 1);
				bcnCnum.push(hm1);

			} else {
				hlxzh = hlxzh + hm1;
				zqValue.push(yn);
				bcnCnum.push(hm1);
				if (yn.toString() == "y") {
					zqNum++;
				} else {
					cwNum++;
				}
			}
			//console.log("zqValue:"+zqValue);
			//ma = 步长范围内所有c（红绿线）之和  / 步长
			ma1 = hlxzh / bcfw;
			var tsumC = 0;
			for (var j = 0; j < bcnCnum.length; j++) {
				tsumC = tsumC + (bcnCnum[j] - ma1) * (bcnCnum[j] - ma1);
			}

			//sumC = sumC + ((spjC-ma1)*(spjC-ma1));//（步长内每期c-ma）平方    累加之和

			//标准差
			var httttt = tsumC / bcfw;
			var bzc = Math.sqrt(httttt); //开放【（步长内每期c-ma）平方    累加之和 / 步长】
			bzc = parseFloat(bzc).toFixed(2);
			//					console.log(tsumC+"-----"+bcfw+"-----"+httttt+"标准差："+bzc)
			//中轨  = 步长范围内所有红绿线之和  / 步长  + 上一期中轨值
			//					console.log("正确数："+zqNum+";错误数："+cwNum+";")

			var hz111 = (zqNum * bc) - cwNum;
			hz111 = parseFloat(hz111).toFixed(2);
			var zg1 = hz111 / bcfw + zgz1 * 1;
			//					zg1 = parseFloat(zg1).toFixed(2);
			//					console.log(""+"上一期中轨："+zgz1+"；和:"+(zqNum*bc - cwNum)+";步长："+bcfw)
			//console.log(i+"中轨："+zg1)
			//添加中轨集合
			zgValue.push(zg1);
			//上轨     中轨+系数*标准差
			var sg1 = zg1 + xs * bzc;
			//添加上轨集合
			sgValue.push(sg1);

			//下轨     中轨-系数*标准差
			var xg1 = zg1 - xs * bzc;
			//console.log(i+"下轨："+xg1)
			//添加下轨集合
			//console.log("中轨："+zg1+"；上轨："+sg1+"；下轨："+xg1)
			xgValue.push(xg1);
			//上一期中轨值
			zg1 = parseFloat(zg1).toFixed(2);
			zgz1 = zg1;

			//第二个图表
			var dqqEma12 = (syqEma12 * 11 / 13) + (spjC * 2 / 13);

			var dqqEma26 = (syqEma26 * 25 / 27) + (spjC * 2 / 27);
			syqEma12 = dqqEma12;
			syqEma26 = dqqEma26;
			var dqDif = syqEma12 - syqEma26;
			//console.log(syqEma12+"=="+syqEma26+"dqDif="+(syqEma12 - syqEma26));
			var dqDea = (syqDea * 8 / 10) + (dqDif * 2 / 10);
			var dqMacd = (dqDif - dqDea) * 2;
			//console.log("dqqEma12="+dqDif +"dqDea=="+dqDea+"dqMacd=="+dqMacd);
			difList.push(dqDif);
			deaList.push(dqDea);
			//if(dqMacd==0){
			//macdList.push(-0.01);
			//}else{
			macdList.push(dqMacd);
			//}



			syqDea = dqDea;

			//第三个坐标图表

			//					var kdj = 9;//kdj周期
			//					var zdj=0,zgj=0,kdjK=50,kdjD=50,syqK=0,syqD=0;
			//					var kList = [],dList = [],jList=[];
			//					var zdjList =[],zgjList[];

			var js2 = i - (kdjZq - 1);
			if (js2 > 0) {
				zdjList.splice(0, 1);
				zdjList.push(spjC);
			} else {
				zdjList.push(spjC);
			}
			zgj = zdjList.max(); //最高价H
			zdj = zdjList.min(); //最低价L

			var rsv = 0;
			if (i == 0) {
				rsv = 100;
			} else {
				rsv = (spjC - zdj) / (zgj - zdj) * 100;
			}
			if (syqK == 0) {
				syqK = 50;
			}
			if (syqD == 0) {
				syqD = 50;
			}

			kdjK = 2 / 3 * syqK + 1 / 3 * rsv;
			kdjD = 2 / 3 * syqD + 1 / 3 * kdjK;
			var kdjJ = 3 * kdjK - 2 * kdjD;

			for (var i = 0; i < rawData.length; i++) {

				vols.push(rawData[i][4]);

				difs.push(rawData[i][7]);
