		<script type="text/javascript">
			sessionStorage.removeItem("obj");
			sessionStorage.removeItem("code_id");
			sessionStorage.removeItem("rotate");
			sessionStorage.removeItem("dm");
			sessionStorage.removeItem("num");
			sessionStorage.removeItem("cc");
			sessionStorage.removeItem("dd");
			//从url截取获得的所有信息存入缓存
			var url = window.location.href.substr(0).split("?")[1];
			var type = url.split("&");
			var submitRow = 1;
			var obj = {};
			for (var i = 0; i < type.length; i++) {
				var key = type[i].split("=")[0];
				var val = type[i].split("=")[1];
				if (key == "language") {
					obj.language = val; //暂时没有使用
				} else if (key == "token") {
					obj.token = val;
				} else if (key == "code") {
					obj.code = val; //城市id
				} else if (key == "play_id") {
					obj.play_id = val; //玩法id
				} else if (key == "chart_id") {
					obj.chart_id = val; //走势图id 在json获取对应名
				} else if (key == "from_Id") {
					obj.from_Id = val; //电脑版901 安卓902 苹果903
				} else if (key == "back") {
					obj.back = val; //回退几步
				} else if (key == "dm") {
					obj.dm = val; //如果有值则是代码图表
					common.cookieSet("dm", val);
				} else if (key == "dis") {
					obj.dis = val; //q==前区 h==后区
				} else if (key == "code_id") {
					obj.code_id = val; //代码走势使用
					common.cookieSet("code_id", val);
				} else if (key == "expect") {
					let expects = val.split("-");
					var result = [];
					for (let i = 0; i < expects.length; i++) {
						let data = {};
						data.expect = expects[i].split("*")[0];
						data.opennumber = expects[i].split("*")[1];
						result.push(data);
					}
					obj.number = result;
				}
			}
			if (common.isNull(common.cookieGet("rotate"))) {
				common.cookieSet("rotate", "heng");
			}
			common.cookieSet("obj", JSON.stringify(obj));
			$(document).ready(function() {
				if (common.isNull(obj.code_id) && common.isNull(obj.dm)) {
					common.showMsg("参数传入冲突,请联系客服处理", 2000);
					return;
				}
				common.server();
			});
		</script>
