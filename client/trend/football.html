		<script type="text/javascript">
			sessionStorage.removeItem("obj");
			sessionStorage.removeItem("rotate");
			sessionStorage.removeItem("game_id");
			sessionStorage.removeItem("total");
			sessionStorage.removeItem("data");
			sessionStorage.removeItem("page");
			//从url截取获得的所有信息存入缓存
			var url = window.location.href.substr(0).split("?")[1];
			var type = url.split("&");
			var submitRow = 1;
			var obj = {};
			for (var i = 0; i < type.length; i++) {
				var key = type[i].split("=")[0];
				var val = type[i].split("=")[1];
				if (key == "competitionId") {
					obj.competitionId = val;
				} else if (key == "minOdds") {
					obj.minOdds = val;
				} else if (key == "maxOdds") {
					obj.maxOdds = val;
				} else if (key == "isSingle") {
					obj.isSingle = val;
				} else if (key == "type") {
					obj.type = val;
				} else if (key == "oddsType") {
					obj.oddsType = val;
				} else if (key == "game_id") {
					obj.game_id = JSON.stringify(val);
				} else if (key == "from_Id") {
					obj.from_Id = val; //电脑版901 安卓902 苹果903
				} else if (key == "back") {
					obj.back = val; //回退几步
				}
			}
			//
			if (obj.from_Id == "901") {
				common.cookieSet("game_id", parent.getGameId());
			} else {
				document.addEventListener('plusready', function() {
					var localName = '';
					if (obj.type == "crs") {
						localName = 'homePageCrs';
					} else if (obj.type == "hda") {
						localName = "homePageHda";
					} else if (obj.type == "hf") {
						localName = "homePageHf";
					} else if (obj.type == "hhda") {
						localName = "homePageHhda";
					} else if (obj.type == "ttg") {
						localName = "homePageTtg";
					}
					var a = JSON.stringify(JSON.parse(plus.storage.getItem(localName)).matchIdAll);
					common.cookieSet("token", plus.storage.getItem("newToken"));
					var gameId = [];
					for (var i = 0; i < a.split(",").length; i++) {
						gameId.push(a.split(",")[i])
					}
					common.cookieSet("game_id", gameId);
					server.server();
				})
			}
			if (common.isNull(common.cookieGet("rotate"))) {
				common.cookieSet("rotate", "heng");
			}
			common.cookieSet("obj", JSON.stringify(obj));
			if (obj.from_Id == "901") {
				$(document).ready(function() {
					server.server();
				});
			}
		</script>
